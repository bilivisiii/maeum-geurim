<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마음그림 — 어린이 그림 심리 분석</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FDF6EC;
    --soft-yellow: #F9E4A0;
    --warm-orange: #F4956A;
    --coral: #E8614A;
    --teal: #4AADA8;
    --teal-dark: #2D8A85;
    --sage: #88B9A0;
    --lavender: #C4A8D4;
    --text-dark: #2C2825;
    --text-mid: #6B5F57;
    --text-light: #A8978E;
    --card-bg: #FFFBF5;
    --shadow: 0 8px 40px rgba(44,40,37,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--cream);
    font-family: 'Gowun Dodum', sans-serif;
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: -120px; right: -120px;
    width: 420px; height: 420px;
    background: radial-gradient(circle, #F9E4A0 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -100px;
    width: 360px; height: 360px;
    background: radial-gradient(circle, #C4E8E7 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .wrapper {
    position: relative; z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  header { text-align: center; margin-bottom: 48px; }
  .logo-icon {
    font-size: 52px;
    display: block;
    margin-bottom: 12px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  header h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 36px;
    color: var(--coral);
    letter-spacing: -1px;
  }
  header p { color: var(--text-mid); font-size: 15px; margin-top: 8px; line-height: 1.6; }
  .upload-card {
    background: var(--card-bg);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 36px;
    margin-bottom: 28px;
  }
  .upload-zone {
    border: 2.5px dashed #D4C9BF;
    border-radius: 20px;
    padding: 48px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    background: #FEFAF4;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--teal);
    background: #F0FAFA;
  }
  .upload-zone .zone-icon { font-size: 48px; margin-bottom: 12px; display: block; }
  .upload-zone p { color: var(--text-mid); font-size: 15px; line-height: 1.7; }
  .upload-zone strong { color: var(--teal-dark); }
  #fileInput { display: none; }
  .preview-wrap { display: none; margin-top: 20px; text-align: center; position: relative; }
  .preview-wrap.show { display: block; }
  .preview-wrap img {
    max-width: 100%; max-height: 340px;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    object-fit: contain;
  }
  .remove-btn {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.55);
    color: white; border: none;
    border-radius: 50%; width: 32px; height: 32px;
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .remove-btn:hover { background: var(--coral); }
  .meta-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 20px;
  }
  @media(max-width:480px) { .meta-row { grid-template-columns: 1fr; } }
  .field label {
    display: block;
    font-size: 13px; font-weight: 600;
    color: var(--text-mid);
    margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: #F7F1E8;
    border: 1.5px solid #E5DAD0;
    border-radius: 12px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text-dark);
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--teal); background: white;
  }
  .field textarea { resize: none; height: 80px; margin-top: 16px; }
  .field.full { grid-column: 1 / -1; }
  .btn-analyze {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; margin-top: 24px; padding: 18px;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
    color: white;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 18px;
    border: none; border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(74,173,168,0.35);
    transition: all 0.25s;
  }
  .btn-analyze:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(74,173,168,0.45);
  }
  .btn-analyze:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .btn-analyze .spinner {
    width: 20px; height: 20px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  .btn-analyze.loading .spinner { display: block; }
  .btn-analyze.loading .btn-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .results { display: none; animation: fadeUp 0.5s ease forwards; }
  .results.show { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .results-header { text-align: center; margin-bottom: 24px; }
  .results-header h2 { font-family: 'Black Han Sans', sans-serif; font-size: 22px; color: var(--text-dark); }
  .results-header p { color: var(--text-light); font-size: 13px; margin-top: 4px; }
  .emotion-banner {
    background: linear-gradient(135deg, #FFF1E8 0%, #FFF8F0 100%);
    border: 2px solid var(--soft-yellow);
    border-radius: 20px;
    padding: 24px 28px;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .emotion-emoji { font-size: 48px; flex-shrink: 0; }
  .emotion-text h3 { font-family: 'Black Han Sans', sans-serif; font-size: 20px; color: var(--coral); }
  .emotion-text p { color: var(--text-mid); font-size: 14px; margin-top: 4px; line-height: 1.6; }
  .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media(max-width:560px) { .section-grid { grid-template-columns: 1fr; } }
  .section-card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 22px;
  }
  .section-card.wide { grid-column: 1 / -1; }
  .section-card .card-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-light);
    margin-bottom: 10px;
  }
  .section-card .card-label .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-orange { background: var(--warm-orange); }
  .dot-teal { background: var(--teal); }
  .dot-lavender { background: var(--lavender); }
  .dot-sage { background: var(--sage); }
  .dot-coral { background: var(--coral); }
  .section-card p, .section-card li { font-size: 14px; color: var(--text-mid); line-height: 1.75; }
  .section-card ul { padding-left: 16px; }
  .bar-row { margin-top: 6px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-mid); margin-bottom: 4px; }
  .bar-track { height: 8px; background: #EDE7DF; border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width 1s ease; width: 0; }
  .tip-box {
    background: linear-gradient(135deg, #EAF7F5 0%, #F0FAF8 100%);
    border-left: 4px solid var(--teal);
    border-radius: 0 16px 16px 0;
    padding: 16px 20px;
    margin-top: 8px;
  }
  .tip-box p { font-size: 14px; color: var(--teal-dark); line-height: 1.7; }
  .disclaimer {
    text-align: center; font-size: 12px; color: var(--text-light);
    margin-top: 24px; line-height: 1.6; padding: 0 16px;
  }
  .error-box {
    background: #FFF0EE; border: 1.5px solid #F4A09A;
    border-radius: 14px; padding: 16px 20px;
    color: var(--coral); font-size: 14px;
    margin-top: 16px; display: none;
  }
  .error-box.show { display: block; }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <span class="logo-icon">🎨</span>
    <h1>마음그림</h1>
    <p>어린이가 그린 그림 속에 담긴 감정과 심리 상태를<br>AI가 따뜻하게 분석해 드립니다.</p>
  </header>

  <div class="upload-card">
    <div class="upload-zone" id="dropZone">
      <span class="zone-icon">🖼️</span>
      <p><strong>클릭하거나 파일을 여기에 드래그</strong>하세요<br>JPG, PNG, WEBP 지원 • 최대 10MB</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div class="preview-wrap" id="previewWrap">
      <img id="previewImg" src="" alt="업로드된 그림">
      <button class="remove-btn" id="removeBtn">✕</button>
    </div>
    <div class="meta-row">
      <div class="field">
        <label>아이 나이</label>
        <select id="ageSelect">
          <option value="">선택하세요</option>
          <option>만 2세</option><option>만 3세</option><option>만 4세</option>
          <option>만 5세</option><option>만 6세</option><option>만 7세</option>
        </select>
      </div>
      <div class="field">
        <label>성별</label>
        <select id="genderSelect">
          <option value="">선택하세요</option>
          <option>남아</option><option>여아</option><option>미입력</option>
        </select>
      </div>
      <div class="field full">
        <textarea id="contextInput" placeholder="추가 정보 (선택): 그림을 그릴 당시 상황, 최근 있었던 일 등을 입력하면 더 정확한 분석이 가능합니다."></textarea>
      </div>
    </div>
    <button class="btn-analyze" id="analyzeBtn" disabled>
      <div class="spinner"></div>
      <span class="btn-text">🔍 그림 분석하기</span>
    </button>
    <div class="error-box" id="errorBox"></div>
  </div>

  <div class="results" id="results">
    <div class="results-header">
      <h2>📋 분석 결과</h2>
      <p id="resultsMeta"></p>
    </div>
    <div class="emotion-banner">
      <span class="emotion-emoji" id="emotionEmoji">😊</span>
      <div class="emotion-text">
        <h3 id="emotionTitle"></h3>
        <p id="emotionDesc"></p>
      </div>
    </div>
    <div class="section-grid">
      <div class="section-card">
        <div class="card-label"><span class="dot dot-orange"></span>그림 특성 분석</div>
        <div id="drawingFeatures"></div>
      </div>
      <div class="section-card">
        <div class="card-label"><span class="dot dot-teal"></span>색상 심리</div>
        <div id="colorPsych"></div>
      </div>
      <div class="section-card">
        <div class="card-label"><span class="dot dot-lavender"></span>감정 지표</div>
        <div id="emotionBars"></div>
      </div>
      <div class="section-card">
        <div class="card-label"><span class="dot dot-sage"></span>발달 관찰</div>
        <div id="devObservation"></div>
      </div>
      <div class="section-card wide">
        <div class="card-label"><span class="dot dot-coral"></span>선생님 / 부모님께 드리는 조언</div>
        <div class="tip-box"><p id="adviceText"></p></div>
      </div>
    </div>
    <p class="disclaimer">
      ⚠️ 이 분석은 참고용 AI 해석입니다. 전문 심리 상담사의 진단을 대체하지 않습니다.<br>
      아이에게 우려되는 점이 있다면 전문가 상담을 권장합니다.
    </p>
  </div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const previewWrap = document.getElementById('previewWrap');
const previewImg = document.getElementById('previewImg');
const removeBtn = document.getElementById('removeBtn');
const analyzeBtn = document.getElementById('analyzeBtn');
const errorBox = document.getElementById('errorBox');
const results = document.getElementById('results');

let base64Image = null;
let imageType = 'image/jpeg';

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
removeBtn.addEventListener('click', () => {
  base64Image = null;
  previewWrap.classList.remove('show');
  previewImg.src = '';
  fileInput.value = '';
  analyzeBtn.disabled = true;
  results.classList.remove('show');
});

function loadFile(file) {
  if (!file.type.startsWith('image/')) { showError('이미지 파일만 업로드 가능합니다.'); return; }
  if (file.size > 10 * 1024 * 1024) { showError('파일 크기는 10MB 이하여야 합니다.'); return; }
  imageType = file.type;
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    base64Image = dataUrl.split(',')[1];
    previewImg.src = dataUrl;
    previewWrap.classList.add('show');
    analyzeBtn.disabled = false;
    errorBox.classList.remove('show');
    results.classList.remove('show');
  };
  reader.readAsDataURL(file);
}

function showError(msg) {
  errorBox.textContent = '⚠️ ' + msg;
  errorBox.classList.add('show');
}

analyzeBtn.addEventListener('click', analyzeDrawing);

async function analyzeDrawing() {
  if (!base64Image) return;
  const age = document.getElementById('ageSelect').value;
  const gender = document.getElementById('genderSelect').value;
  const context = document.getElementById('contextInput').value.trim();

  analyzeBtn.classList.add('loading');
  analyzeBtn.disabled = true;
  errorBox.classList.remove('show');
  results.classList.remove('show');

  const childInfo = [age && `나이: ${age}`, gender && `성별: ${gender}`, context && `추가 정보: ${context}`].filter(Boolean).join('\n');

  const prompt = `당신은 아동 미술 심리 전문가입니다. 아래 어린이가 그린 그림을 분석해 주세요.
${childInfo ? `[아이 정보]\n${childInfo}\n` : ''}
다음 JSON 형식으로만 응답하세요 (다른 텍스트 없이):
{
  "overallEmotion": {
    "emoji": "감정을 나타내는 이모지 1개",
    "title": "전반적 감정 상태",
    "description": "2-3문장으로 전반적인 심리 상태 설명"
  },
  "drawingFeatures": ["특성1","특성2","특성3"],
  "colorPsych": "색상 선택에 담긴 심리적 의미 2-3문장",
  "emotionScores": [
    {"label": "안정감", "score": 75, "color": "#4AADA8"},
    {"label": "표현 욕구", "score": 85, "color": "#F4956A"},
    {"label": "사회성", "score": 65, "color": "#C4A8D4"},
    {"label": "자신감", "score": 70, "color": "#88B9A0"}
  ],
  "developmentObservation": "발달 수준 관찰 2-3문장",
  "advice": "선생님/부모님께 드리는 조언 2-4문장"
}`;

  try {
    const response = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64Image, imageType, prompt })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || '오류가 발생했습니다.');
    const text = data.content.find(b => b.type === 'text')?.text || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    renderResults(parsed, age, gender);
  } catch (err) {
    showError(err.message || '분석 중 오류가 발생했습니다. 다시 시도해 주세요.');
  } finally {
    analyzeBtn.classList.remove('loading');
    analyzeBtn.disabled = false;
  }
}

function renderResults(data, age, gender) {
  const meta = [age, gender].filter(Boolean).join(' · ');
  document.getElementById('resultsMeta').textContent = meta || '그림 분석 완료';
  document.getElementById('emotionEmoji').textContent = data.overallEmotion.emoji;
  document.getElementById('emotionTitle').textContent = data.overallEmotion.title;
  document.getElementById('emotionDesc').textContent = data.overallEmotion.description;
  document.getElementById('drawingFeatures').innerHTML = '<ul>' + data.drawingFeatures.map(f => `<li>${f}</li>`).join('') + '</ul>';
  document.getElementById('colorPsych').innerHTML = `<p>${data.colorPsych}</p>`;
  document.getElementById('emotionBars').innerHTML = data.emotionScores.map(s => `
    <div class="bar-row">
      <div class="bar-label"><span>${s.label}</span><span>${s.score}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="background:${s.color};width:0%" data-width="${s.score}%"></div></div>
    </div>`).join('');
  document.getElementById('devObservation').innerHTML = `<p>${data.developmentObservation}</p>`;
  document.getElementById('adviceText').textContent = data.advice;
  results.classList.add('show');
  results.scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(() => {
    document.querySelectorAll('.bar-fill').forEach(el => { el.style.width = el.dataset.width; });
  }, 200);
}
</script>
</body>
</html>
